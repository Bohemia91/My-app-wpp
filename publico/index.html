<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ofertas - Santa Rosa de Osos</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: Arial, sans-serif; }
        header { background: #0A5F26; color: white; padding: 1.5rem; text-align: center; }
        
        .lista-ofertas { padding: 2rem; display: grid; grid-template-columns: repeat(auto-fill, minmax(320px, 1fr)); gap: 1.5rem; }
        .oferta { border: 2px solid #E0E0E0; border-radius: 12px; padding: 1.5rem; background: white; }
        .perfil-usuario { display: flex; align-items: center; gap: 1rem; margin-bottom: 1rem; }
        .foto-perfil { width: 50px; height: 50px; border-radius: 50%; object-fit: cover; border: 2px solid #D4AF37; }
        .nombre-comercio { font-weight: bold; color: #0A5F26; font-size: 1.1rem; }
        .descuento { color: #D4AF37; font-weight: bold; font-size: 1.2rem; margin: 0.5rem 0; }
        .precio-normal { text-decoration: line-through; color: #999; font-size: 0.9rem; }
        .precio-final { color: #0A5F26; font-size: 1.3rem; font-weight: bold; margin: 0.5rem 0; }
        .boton-wpp { background: #25D366; color: white; border: none; padding: 0.8rem; border-radius: 8px; cursor: pointer; margin-top: 1rem; width: 100%; font-weight: bold; }
        .boton-volver { position: fixed; top: 1rem; left: 1rem; background: #0A5F26; color: white; padding: 0.7rem 1rem; border-radius: 8px; text-decoration: none; font-weight: bold; }
        .mensaje-inicio { text-align: center; padding: 3rem; color: #666; font-size: 1.1rem; }
    </style>
</head>
<body>
    <a href="../index.html" class="boton-volver">← Volver</a>
    <header>
        <h1>Ofertas y Promociones</h1>
        <p>Santa Rosa de Osos</p>
    </header>

    <div class="mensaje-inicio">
        📢 Las ofertas se irán cargando a medida que los comercios publiquen sus productos<br>
        <br>
        <em>¡Pronto verás muchas promociones disponibles!</em>
    </div>

    <div id="listaOfertas" class="lista-ofertas">
        <!-- Aquí se irán agregando las ofertas que los comercios publiquen -->
    </div>

    <script src="../config/configuracion.js"></script>
</body>
</html>
